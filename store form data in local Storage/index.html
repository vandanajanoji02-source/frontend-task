<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Save Form Draft</title>
	<style>
		:root {
			font-family: Arial, sans-serif;
			color: #1f2937;
			background: #eef2f7;
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			place-items: center;
		}

		form {
			box-sizing: border-box;
			width: min(92%, 460px);
			padding: 2rem;
			background: #ffffff;
			border-radius: 10px;
			box-shadow: 0 12px 30px rgb(31 41 55 / 12%);
		}

		h1 {
			margin-top: 0;
		}

		.field {
			display: grid;
			gap: 0.4rem;
			margin-bottom: 1rem;
		}

		label {
			font-weight: 600;
		}

		input,
		textarea,
		button {
			box-sizing: border-box;
			width: 100%;
			padding: 0.7rem;
			border: 1px solid #9ca3af;
			border-radius: 6px;
			font: inherit;
		}

		textarea {
			min-height: 120px;
			resize: vertical;
		}

		button {
			border: 0;
			background: #2563eb;
			color: #ffffff;
			cursor: pointer;
			font-weight: 600;
		}

		button:hover {
			background: #1d4ed8;
		}

		#status {
			min-height: 1.25rem;
			margin-bottom: 0;
			color: #166534;
		}
	</style>
</head>
<body>
	<form id="contact-form">
		<h1>Contact us</h1>

		<div class="field">
			<label for="name">Name</label>
			<input id="name" name="name" type="text" autocomplete="name" required>
		</div>

		<div class="field">
			<label for="email">Email</label>
			<input id="email" name="email" type="email" autocomplete="email" required>
		</div>

		<div class="field">
			<label for="message">Message</label>
			<textarea id="message" name="message" required></textarea>
		</div>

		<button type="submit">Submit</button>
		<p id="status" role="status" aria-live="polite"></p>
	</form>

	<script>
		function persistFormDraft(form, storageKey) {
			const savedDraft = localStorage.getItem(storageKey);

			if (savedDraft) {
				const values = JSON.parse(savedDraft);
				Object.entries(values).forEach(([name, value]) => {
					const field = form.elements.namedItem(name);
					if (field) field.value = value;
				});
			}

			form.addEventListener('input', () => {
				const values = Object.fromEntries(
					Array.from(form.elements)
						.filter((field) => field.name)
						.map((field) => [field.name, field.value])
				);
				localStorage.setItem(storageKey, JSON.stringify(values));
			});
		}

		const contactForm = document.querySelector('#contact-form');
		const status = document.querySelector('#status');
		const storageKey = 'contact-form-draft';

		persistFormDraft(contactForm, storageKey);

		contactForm.addEventListener('submit', (event) => {
			event.preventDefault();
			localStorage.removeItem(storageKey);
			contactForm.reset();
			status.textContent = 'Form submitted and saved draft cleared.';
		});
	</script>
</body>
</html>
